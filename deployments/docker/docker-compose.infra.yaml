name: unified-document-viewer

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: viewer
      POSTGRES_PASSWORD: viewer
      POSTGRES_DB: viewer
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewer -d viewer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Named per major so `make db-up` does not reuse a PG17 postgres-data volume.
    volumes: ["postgres18-data:/var/lib/postgresql"]
    restart: unless-stopped

volumes:
  postgres18-data:
